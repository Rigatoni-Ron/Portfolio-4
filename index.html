<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aaron Chartrand, Product Designer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Keep this site out of search results. Paired with the X-Robots-Tag
         header in vercel.json, which also covers non-HTML responses. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta
      name="description"
      content="Product designer based in Toronto. Currently at Anchorage Digital."
    />

    <!-- Link previews (Open Graph). Absolute URLs: scrapers don't resolve
         relative paths. og:image is 1200x630, the ratio LinkedIn/X/Slack crop to. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.aaronchartrand.me/" />
    <meta property="og:title" content="Aaron Chartrand, Product Designer" />
    <meta
      property="og:description"
      content="Product designer based in Toronto. Currently at Anchorage Digital."
    />
    <meta property="og:image" content="https://www.aaronchartrand.me/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A collateral management interface showing an LTV health meter, a loan-to-value chart, and the loaned and collateral assets"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aaron Chartrand, Product Designer" />
    <meta
      name="twitter:description"
      content="Product designer based in Toronto. Currently at Anchorage Digital."
    />
    <meta name="twitter:image" content="https://www.aaronchartrand.me/og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
